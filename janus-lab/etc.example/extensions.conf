; Se añade al final del extensions.conf de serie.
;
; Todo va a Stasis: el dialplan no decide nada, solo entrega la llamada al motor.

[jaime]
exten => 100,1,Stasis(janus)
 same => n,Hangup()

; Con una troncal real, el contexto es este y el número marcado viaja como
; argumento, que es con lo que el motor elige qué flujo cargar:
;
; [from-trunk]
; exten => _X.,1,Stasis(janus,${EXTEN})
;  same => n,Hangup()
