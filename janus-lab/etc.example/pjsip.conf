; Bloques propios de Janus. Van AL PRINCIPIO del pjsip.conf que trae la imagen
; de Asterisk; el resto del fichero son los ejemplos de serie, todos comentados.
;
; El nombre del endpoint TIENE que ser el usuario SIP: cuando llega un REGISTER,
; Asterisk busca un endpoint que se llame como el usuario que manda el teléfono.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── jaime ────────────────────────────────────────────────────────────────────
[jaime-auth]
type=auth
auth_type=userpass
username=jaime
password=CAMBIAME

[jaime-aor]
type=aor
max_contacts=1

[jaime]
type=endpoint
context=jaime
disallow=all
allow=ulaw
auth=jaime-auth
aors=jaime-aor
direct_media=no      ; Asterisk se queda en medio del audio: sin esto, ni
                     ; playback fiable ni detección de DTMF.

; ── ana ──────────────────────────────────────────────────────────────────────
[ana-auth]
type=auth
auth_type=userpass
username=ana
password=CAMBIAME

[ana-aor]
type=aor
max_contacts=1

[ana]
type=endpoint
context=jaime
disallow=all
allow=ulaw
auth=ana-auth
aors=ana-aor
direct_media=no
